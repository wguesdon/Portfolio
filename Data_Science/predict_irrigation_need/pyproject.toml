    "lightgbm>=4.5.0",
    "matplotlib>=3.9.2",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "seaborn>=0.13.2",
    "xgboost>=2.1.1",
]
